<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Every big movie and TV franchise in the order you should actually watch it, with Rotten Tomatoes scores and a catch-up tracker."><meta name="theme-color" content="#120405"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 22 30%22%3E%3Cpath d=%22M8 0h6v3H8z%22 fill=%22%23f3e7d3%22/%3E%3Cpath d=%22M7 3h8l1 3H6z%22 fill=%22%23f3e7d3%22 opacity=%22.7%22/%3E%3Cpath d=%22M6 6h10v3H6z%22 fill=%22%23f3e7d3%22/%3E%3Crect x=%224%22 y=%229%22 width=%2214%22 height=%2221%22 rx=%224%22 fill=%22%23e2262e%22/%3E%3Crect x=%226.5%22 y=%2215%22 width=%229%22 height=%228%22 rx=%221%22 fill=%22%23f3e7d3%22/%3E%3C/svg%3E"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Catchup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: two views in one shell. Library = dense ledger of franchises with a "Tonight" lead.
   Franchise = numbered poster wall with a sticky "Up next" action bar. Detail = bottom sheet.
   Dark-first: a theater, not a dashboard. Ketchup red is the only accent; mustard marks "next". */
:root{
  --bg:#120405;
  --surface:#1c0709;
  --surface-2:#260a0d;
  --line:rgba(246,233,214,.13);
  --line-strong:rgba(246,233,214,.28);
  --ink:#f3e7d3;
  --muted:#b39c87;
  --ketchup:#e2262e;
  --ketchup-deep:#9d141b;
  --mustard:#f2b705;
  --mustard-ink:#1b0b0c;
  --rotten:#8fc43f;
  --shadow:0 18px 40px rgba(0,0,0,.5);
  --display:'Big Shoulders Display','Oswald','Arial Narrow',sans-serif;
  --body:'Archivo','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f3ead9;--surface:#ebe0cb;--surface-2:#e2d5bc;--line:rgba(27,11,12,.14);--line-strong:rgba(27,11,12,.3);
  --ink:#1b0b0c;--muted:#6d5a4c;--ketchup:#c9202a;--ketchup-deep:#9d141b;--mustard:#d79f00;--mustard-ink:#1b0b0c;--rotten:#5e8f1f;
  --shadow:0 18px 40px rgba(60,30,10,.22);color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3ead9;--surface:#ebe0cb;--surface-2:#e2d5bc;--line:rgba(27,11,12,.14);--line-strong:rgba(27,11,12,.3);
  --ink:#1b0b0c;--muted:#6d5a4c;--ketchup:#c9202a;--ketchup-deep:#9d141b;--mustard:#d79f00;--mustard-ink:#1b0b0c;--rotten:#5e8f1f;
  --shadow:0 18px 40px rgba(60,30,10,.22);color-scheme:light}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;text-align:left}
a{color:inherit}
:focus-visible{outline:2px solid var(--mustard);outline-offset:3px}
:focus:not(:focus-visible){outline:none}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto}
.d{font-family:var(--display);text-transform:uppercase;letter-spacing:.01em;line-height:.9}
.num{font-variant-numeric:tabular-nums}
.cap{font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:56px}
.mark{display:flex;align-items:center;gap:9px;flex:0 0 auto;text-decoration:none}
.mark svg{width:22px;height:30px}
.mark .d{font-size:1.9rem;font-weight:900;letter-spacing:.03em}
.mark .d i{font-style:normal;color:var(--ketchup)}
.back{display:none;align-items:center;gap:8px;height:40px;padding-right:10px;font-weight:600;color:var(--muted)}
.back svg{width:20px;height:20px}
.back:hover{color:var(--ink)}
body[data-view="franchise"] .back{display:inline-flex}
.top-title{flex:1;min-width:0;display:none;font-size:1.35rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body[data-view="franchise"] .top-title{display:block}
body[data-view="franchise"] .mark{display:none}
@media (min-width:720px){body[data-view="franchise"] .mark{display:flex}}
.search{flex:1;min-width:0;position:relative;display:flex;align-items:center}
body[data-view="franchise"] .search{display:none}
.search svg{position:absolute;left:12px;width:16px;height:16px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:38px;background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:0 34px;font:inherit;font-size:.92rem;border-radius:3px}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--line-strong);outline:none}
.search .clear{position:absolute;right:6px;width:28px;height:28px;display:none;place-items:center;color:var(--muted)}
.search .clear svg{position:static;width:14px;height:14px;color:inherit}
.search.has .clear{display:grid}
.stat{flex:0 0 auto;text-align:right;line-height:1.15}
.stat b{display:block;font-family:var(--display);font-size:1.5rem;font-weight:700}
@media (max-width:719px){.stat{display:none}}

/* ---------- search results ---------- */
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line-strong);box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:25;display:none;border-radius:3px}
.results.open{display:block}
.results .grp{padding:10px 12px 4px;border-top:1px solid var(--line)}
.results .grp:first-child{border-top:0}
.results button{display:flex;width:100%;align-items:center;gap:10px;padding:9px 12px;font-size:.92rem}
.results button:hover,.results button.sel{background:var(--surface-2)}
.results .sub{margin-left:auto;color:var(--muted);font-size:.78rem;white-space:nowrap}
.results .none{padding:14px 12px;color:var(--muted)}

/* ---------- library ---------- */
.lib{padding-block:22px 60px}
.tonight{display:grid;grid-template-columns:116px 1fr;gap:18px;align-items:stretch;padding:18px 0 22px;border-bottom:1px solid var(--line)}
.tonight .post{aspect-ratio:2/3;max-width:100%;border-radius:2px;overflow:hidden;position:relative;background:var(--surface-2);box-shadow:var(--shadow)}
.tonight .body{display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-width:0}
.tonight h2{margin:4px 0 0;font-size:clamp(2.1rem,7vw,3.6rem);font-weight:900;text-wrap:balance}
.tonight .why{color:var(--muted);font-size:.92rem;max-width:56ch;margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border:1px solid var(--line-strong);border-radius:3px;font-weight:600;font-size:.9rem;transition:background .12s,border-color .12s,transform .08s;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ketchup);border-color:var(--ketchup);color:#fff}
.btn.primary:hover{background:var(--ketchup-deep);border-color:var(--ketchup-deep)}
.btn.mustard{background:var(--mustard);border-color:var(--mustard);color:var(--mustard-ink)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn svg{width:16px;height:16px}
.btn.sm{height:34px;padding:0 12px;font-size:.82rem}

.ledger-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:22px 0 10px}
.ledger-head h3{margin:0;font-size:1.6rem;font-weight:700}
.sorts{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.sorts button{padding:8px 10px 10px;font-size:.82rem;font-weight:600;color:var(--muted);position:relative}
.sorts button.on{color:var(--ink)}
.sorts button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--ketchup)}
.ledger{display:grid}
.row{display:grid;grid-template-columns:34px 1fr auto;gap:0 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);width:100%;transition:background .12s}
.row:hover{background:var(--surface)}
.row .idx{font-family:var(--display);font-size:1.3rem;font-weight:700;color:var(--muted);text-align:right}
.row .name{font-family:var(--display);font-size:1.55rem;font-weight:700;line-height:1;letter-spacing:.01em}
.row .sub{display:flex;gap:10px;flex-wrap:wrap;margin-top:5px;font-size:.8rem;color:var(--muted)}
.row .sub .next{color:var(--ink)}
.row .sub .next::before{content:"Next · ";color:var(--muted)}
.row .right{display:grid;justify-items:end;gap:6px;min-width:96px}
.row .frac{font-family:var(--display);font-size:1.35rem;font-weight:700;line-height:1}
.row .frac small{font-size:.9rem;color:var(--muted);font-weight:500}
.row.done .name{color:var(--muted)}
.row.done .frac{color:var(--mustard)}
.bar{width:96px;height:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ketchup);transition:width .3s}
.row.done .bar i{background:var(--mustard)}
@media (max-width:560px){
  .row{grid-template-columns:1fr auto;gap:0 10px}
  .row .idx{display:none}
  .row .name{font-size:1.35rem}
  .row .sub .avg{display:none}
  .row .right{min-width:70px}.bar{width:70px}
}
.libfoot{display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding-top:22px;color:var(--muted);font-size:.8rem}
.libfoot .tools{display:flex;gap:4px}

/* ---------- franchise view ---------- */
.fr{padding-block:18px 120px}
.fr-head{display:grid;grid-template-columns:1fr auto;gap:12px 24px;align-items:end;padding-bottom:16px;border-bottom:1px solid var(--line)}
.fr-head h2{margin:2px 0 8px;font-size:clamp(2.6rem,9vw,4.6rem);font-weight:900;text-wrap:balance}
.fr-head .note{margin:0;color:var(--muted);max-width:62ch;font-size:.93rem}
.ends{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;align-items:baseline;font-size:.88rem;min-width:220px}
.ends .cap{text-align:right}
.ends b{font-weight:600}
@media (max-width:719px){.fr-head{grid-template-columns:1fr}.ends{min-width:0}}
.fr-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 0 18px}
@media (max-width:719px){.fr-tools{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));justify-content:flex-start}.fr-tools::-webkit-scrollbar{display:none}.fr-tools>*{flex:0 0 auto}.toggles{flex-wrap:nowrap}.toggles .tog,.seg button{white-space:nowrap}}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:3px;overflow:hidden}
.seg button{height:34px;padding:0 12px;font-size:.82rem;font-weight:600;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg button:hover:not(.on){background:var(--surface)}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.tog{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:3px;font-size:.82rem;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.tog i{width:8px;height:8px;border-radius:50%;background:var(--line-strong);transition:background .12s}
.tog.on{color:var(--ink);border-color:var(--line-strong)}
.tog.on i{background:var(--mustard)}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:22px 14px}
@media (max-width:480px){.wall{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 8px}}
.item{display:grid;gap:7px;width:100%;min-width:0;position:relative}
.poster,.post,.thumb{container-type:inline-size}
.poster{position:relative;aspect-ratio:2/3;max-width:100%;overflow:hidden;border-radius:2px;background:var(--surface-2);
  box-shadow:0 10px 24px rgba(0,0,0,.4);transition:transform .15s,filter .25s,outline-color .15s;outline:2px solid transparent;outline-offset:0}
.item:hover .poster{transform:translateY(-3px)}
.item:active .poster{transform:scale(.97)}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.fallback{position:absolute;inset:0;display:grid;grid-template-rows:1fr auto;padding:10px;
  background:linear-gradient(170deg,hsl(var(--h) 55% 24%),hsl(calc(var(--h) + 18) 60% 12%))}
.fallback .ft{align-self:end;font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.9;font-size:clamp(.8rem,13cqw,1.5rem);color:#f3e7d3;overflow-wrap:break-word;hyphens:auto}
.fallback .fy{margin-top:6px;font-size:.7rem;letter-spacing:.1em;color:rgba(243,231,211,.7)}
.tab{position:absolute;left:0;top:0;z-index:2;min-width:30px;height:28px;padding:0 7px;background:var(--ink);color:var(--bg);
  font-family:var(--display);font-weight:900;font-size:1.2rem;line-height:28px;text-align:center;border-radius:2px 0 4px 0}
.chk{position:absolute;right:6px;top:6px;z-index:3;width:30px;height:30px;border-radius:50%;background:rgba(18,4,5,.7);border:1.5px solid rgba(243,231,211,.55);
  display:grid;place-items:center;color:#f3e7d3;opacity:0;transition:opacity .15s,background .15s,transform .2s cubic-bezier(.2,1.5,.4,1)}
.chk svg{width:16px;height:16px}
.item:hover .chk,.item:focus-within .chk{opacity:1}
@media (hover:none){.chk{opacity:1}}
.item.done .chk{opacity:1;background:var(--mustard);color:var(--mustard-ink);border-color:var(--mustard)}
.item.done .poster{filter:saturate(.25) brightness(.55)}
.item.done .tab{background:var(--mustard);color:var(--mustard-ink)}
.item.next .poster{outline-color:var(--mustard)}
.nextlab{position:absolute;z-index:2;left:0;bottom:0;background:var(--mustard);color:var(--mustard-ink);font-size:.66rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:0 3px 0 0}
.item.soon .poster{outline:1px dashed var(--line-strong)}
.squeeze{animation:squeeze .35s}
@keyframes squeeze{0%{transform:scale(1)}35%{transform:scale(.93,1.05)}65%{transform:scale(1.04,.96)}100%{transform:scale(1)}}
.ttl{font-weight:600;font-size:.86rem;line-height:1.2;overflow-wrap:anywhere}
.item.done .ttl{color:var(--muted)}
.sub2{display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}
.rt{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--ink)}
.rt svg{width:14px;height:14px}
.rt.fresh svg{color:var(--ketchup)}
.rt.rotten svg{color:var(--rotten)}
.rt.tbd{color:var(--muted);font-weight:500}
.empty{padding:40px 0;color:var(--muted)}
.fr-nav{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:16px;border-top:1px solid var(--line)}
.fr-nav button{display:grid;gap:3px;max-width:48%}
.fr-nav button:last-child{text-align:right;justify-items:end}
.fr-nav .d{font-size:1.4rem;font-weight:700}
.fr-nav button:hover .d{color:var(--ketchup)}

/* sticky up-next bar */
.upbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line-strong);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  transform:translateY(110%);transition:transform .25s}
body[data-view="franchise"] .upbar{transform:none}
.upbar .wrap{display:flex;align-items:center;gap:12px;height:66px}
.upbar .thumb{width:30px;height:45px;flex:0 0 auto;background:var(--surface-2);overflow:hidden;border-radius:2px;position:relative}
.upbar .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.upbar .thumb .ft,.upbar .thumb .fy{display:none}
.upbar .txt{flex:1;min-width:0;line-height:1.2}
.upbar .txt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upbar .txt small{color:var(--muted);font-size:.78rem}
.upbar .btn{flex:0 0 auto}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-top:1px solid var(--line-strong);
  border-radius:10px 10px 0 0;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1);max-height:88vh;overflow:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
body.sheet-open .scrim{opacity:1;pointer-events:auto}
body.sheet-open .sheet{transform:none}
.sheet .wrap{max-width:720px}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line-strong);margin:10px auto 14px}
.sh{display:grid;grid-template-columns:120px 1fr;gap:16px}
.sh .post{aspect-ratio:2/3;max-width:100%;border-radius:2px;overflow:hidden;position:relative;background:var(--surface-2)}
.sh h3{margin:0 0 6px;font-size:clamp(1.9rem,6vw,2.6rem);font-weight:900;text-wrap:balance}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.88rem;align-items:baseline;margin:8px 0 14px}
.facts .cap{text-align:right}
.sheet .actions{margin-top:4px}
.links{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:.84rem}
.links a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line-strong);padding-bottom:1px}
.links a:hover{color:var(--ink)}
.sheet .close{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:8px;width:36px;height:36px;display:grid;place-items:center;color:var(--muted)}
.sheet .close svg{width:18px;height:18px}
@media (max-width:420px){.sh{grid-template-columns:96px 1fr}}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:50;background:var(--ink);color:var(--bg);
  padding:10px 10px 10px 14px;border-radius:4px;display:flex;align-items:center;gap:12px;font-size:.88rem;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{font-weight:700;color:var(--ketchup);padding:4px 6px;text-transform:uppercase;letter-spacing:.06em;font-size:.78rem}
body[data-view="library"] .toast{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
body.sheet-open .toast{bottom:auto;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px)}
body.sheet-open .toast.show{transform:translate(-50%,0)}

.hap{position:fixed;left:-9999px;top:0;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- state ---------- */
const now=new Date(),TODAY=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let watched=store.get('catchup.watched',{});
let orderMode=store.get('catchup.order','story');
let filters=store.get('catchup.filters',{kind:'all',unwatched:false,fresh:false});
let librarySort=store.get('catchup.sort','continue');
let view={name:'library',fid:null};
const byId=Object.fromEntries(F.map(f=>[f.id,f]));
const TOTAL=F.reduce((n,f)=>n+f.items.length,0);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hapSwitch=$('#hapSwitch');
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}try{hapSwitch.click()}catch(e){}}

/* ---------- derived ---------- */
const isDone=(f,i)=>!!(watched[f.id]&&watched[f.id][i]);
const doneCount=f=>f.items.reduce((n,_,i)=>n+(isDone(f,i)?1:0),0);
const released=it=>it[1]<=TODAY;
function order(f,mode=orderMode){const idx=f.items.map((_,i)=>i);return mode==='release'?idx.sort((a,b)=>f.items[a][1].localeCompare(f.items[b][1])||a-b):idx}
function nextUp(f){for(const i of order(f)){if(!isDone(f,i)&&released(f.items[i]))return i}return -1}
function avgRT(f){const s=f.items.filter(x=>x[2]!=null);return s.length?Math.round(s.reduce((n,x)=>n+x[2],0)/s.length):null}
const fmtDate=d=>MON[+d.slice(5,7)-1]+' '+d.slice(0,4);
function rtBadge(it){const rt=it[2];
  if(rt==null)return `<span class="rt tbd">${released(it)?'No score yet':fmtDate(it[1])}</span>`;
  const fresh=rt>=60;return `<span class="rt ${fresh?'fresh':'rotten'}" title="Tomatometer ${rt}%"><svg aria-hidden="true"><use href="#i-${fresh?'fresh':'rotten'}"/></svg><span class="num">${rt}%</span></span>`}
function posterHTML(f,i,cls=''){const it=f.items[i];const u=posterCache[key(it)];
  return u?`<img src="${esc(u)}" alt="" loading="lazy">`:`<div class="fallback" style="--h:${f.hue}"><span class="ft">${esc(it[0])}</span><span class="fy">${it[1].slice(0,4)}${it[3]==='t'?' · SERIES':''}</span></div>`}

/* ---------- library ---------- */
function pickTonight(){
  const started=F.filter(f=>doneCount(f)>0&&nextUp(f)>=0).sort((a,b)=>(doneCount(b)/b.items.length)-(doneCount(a)/a.items.length)||doneCount(b)-doneCount(a));
  if(started.length){const f=started[0];return{f,i:nextUp(f),why:`You're ${doneCount(f)} of ${f.items.length} into ${f.name}. This is the next one in ${orderMode} order.`}}
  const top=F.filter(f=>nextUp(f)>=0&&avgRT(f)!=null&&f.items.length>=4).sort((a,b)=>avgRT(b)-avgRT(a)).slice(0,10);
  const day=Math.floor(Date.now()/864e5);const fresh=top[day%top.length]||F.find(f=>nextUp(f)>=0);
  return{f:fresh,i:nextUp(fresh),why:`Nothing started yet. ${fresh.name} averages ${avgRT(fresh)}% with critics across ${fresh.items.length} titles, and this is where it begins. The pick changes nightly until you start something.`}
}
function sortedFranchises(){
  const a=[...F];
  const prog=f=>doneCount(f)/f.items.length;
  if(librarySort==='az')return a.sort((x,y)=>x.name.localeCompare(y.name));
  if(librarySort==='rated')return a.sort((x,y)=>(avgRT(y)||0)-(avgRT(x)||0));
  if(librarySort==='size')return a.sort((x,y)=>y.items.length-x.items.length);
  return a.sort((x,y)=>{const px=prog(x),py=prog(y);const sx=px>0&&px<1?0:px===0?1:2,sy=py>0&&py<1?0:py===0?1:2;
    return sx-sy||(sx===0?py-px:0)||x.name.localeCompare(y.name)});
}
function renderLibrary(){
  const t=pickTonight(),seen=F.reduce((n,f)=>n+doneCount(f),0);
  const rows=sortedFranchises().map((f,n)=>{const d=doneCount(f),tot=f.items.length,nx=nextUp(f),tv=f.items.filter(x=>x[3]==='t').length,mv=tot-tv,avg=avgRT(f);
    return `<button class="row${d===tot?' done':''}" data-open="${f.id}">
      <span class="idx num">${n+1}</span>
      <span><span class="name">${esc(f.name)}</span>
        <span class="sub"><span>${mv?mv+(mv===1?' film':' films'):''}${mv&&tv?' · ':''}${tv?tv+(tv===1?' series':' series'):''}</span>${avg!=null?`<span class="avg">avg ${avg}%</span>`:''}${nx>=0?`<span class="next">${esc(f.items[nx][0])}</span>`:d===tot?`<span class="next" style="color:var(--mustard)">Caught up</span>`:''}</span></span>
      <span class="right"><span class="frac num">${d}<small>/${tot}</small></span><span class="bar"><i style="width:${d/tot*100}%"></i></span></span>
    </button>`}).join('');
  $('#view').innerHTML=`<div class="wrap lib">
    <section class="tonight" aria-label="Tonight">
      <button class="post" data-sheet="${t.f.id}:${t.i}" aria-label="Open ${esc(t.f.items[t.i][0])}">${posterHTML(t.f,t.i)}</button>
      <div class="body">
        <div><span class="cap">Tonight</span><h2 class="d">${esc(t.f.items[t.i][0])}</h2>
          <div class="sub2" style="margin:6px 0 10px">${rtBadge(t.f.items[t.i])}<span>${t.f.items[t.i][1].slice(0,4)}</span><span>${t.f.items[t.i][3]==='t'?'Series':'Film'}</span><span>#${order(t.f).indexOf(t.i)+1} of ${t.f.items.length}</span></div>
          <p class="why">${esc(t.why)}</p></div>
        <div class="actions"><button class="btn primary" data-watch="${t.f.id}:${t.i}"><svg aria-hidden="true"><use href="#i-check"/></svg>Watched it</button><button class="btn" data-open="${t.f.id}">Open ${esc(t.f.name)}</button></div>
      </div>
    </section>
    <div class="ledger-head"><h3 class="d">All franchises</h3>
      <div class="sorts" role="tablist">${[['continue','Continue'],['az','A–Z'],['rated','Best rated'],['size','Biggest']].map(([k,l])=>`<button data-sort="${k}" class="${librarySort===k?'on':''}">${l}</button>`).join('')}</div></div>
    <div class="ledger">${rows}</div>
    <div class="libfoot"><span>${seen} of ${TOTAL} titles caught up · ${F.length} franchises · story order is the order the events happen, not release order.</span>
      <span class="tools"><button class="btn ghost sm" id="copyProg">Copy my progress</button><button class="btn ghost sm" id="resetProg">Reset</button></span></div>
  </div>`;
  loadPosters(t.f,[t.i]);
}

/* ---------- franchise ---------- */
function visibleIdx(f){return order(f).filter(i=>{const it=f.items[i];
  if(filters.kind==='m'&&it[3]!=='m')return false;if(filters.kind==='t'&&it[3]!=='t')return false;
  if(filters.unwatched&&isDone(f,i))return false;if(filters.fresh&&it[2]!=null&&it[2]<60)return false;return true})}
function renderFranchise(fid){
  const f=byId[fid],fi=F.indexOf(f),idx=order(f),vis=visibleIdx(f),nx=nextUp(f),d=doneCount(f),tot=f.items.length;
  const prev=F[(fi-1+F.length)%F.length],next=F[(fi+1)%F.length];
  const first=f.items[idx[0]][0],last=f.items[idx[idx.length-1]][0];
  const cards=vis.map(i=>{const it=f.items[i],n=idx.indexOf(i)+1;
    return `<div class="item${isDone(f,i)?' done':''}${i===nx?' next':''}${released(it)?'':' soon'}" data-item="${i}">
      <button class="poster" data-sheet="${f.id}:${i}" aria-label="${esc(it[0])}, details"><span class="tab num">${n}</span>${posterHTML(f,i)}${i===nx?'<span class="nextlab">Up next</span>':''}</button>
      <button class="chk" data-watch="${f.id}:${i}" aria-pressed="${isDone(f,i)}" aria-label="${isDone(f,i)?'Unmark':'Mark'} ${esc(it[0])} watched"><svg aria-hidden="true"><use href="#i-check"/></svg></button>
      <span class="ttl">${esc(it[0])}</span>
      <span class="sub2">${rtBadge(it)}<span>${it[1].slice(0,4)}</span>${it[3]==='t'?'<span>Series</span>':''}</span>
    </div>`}).join('');
  $('#view').innerHTML=`<div class="wrap fr">
    <div class="fr-head"><div><span class="cap">${fi+1} of ${F.length} · ${tot} titles · ${d} caught up</span><h2 class="d">${esc(f.name)}</h2><p class="note">${esc(f.note)}</p></div>
      <div class="ends"><span class="cap">Start</span><b>${esc(first)}</b><span class="cap">End</span><b>${esc(last)}</b></div></div>
    <div class="fr-tools">
      <div class="seg" role="group" aria-label="Order"><button data-order="story" class="${orderMode==='story'?'on':''}">Story order</button><button data-order="release" class="${orderMode==='release'?'on':''}">Release order</button></div>
      <div class="toggles">
        <div class="seg" role="group" aria-label="Type"><button data-kind="all" class="${filters.kind==='all'?'on':''}">All</button><button data-kind="m" class="${filters.kind==='m'?'on':''}">Films</button><button data-kind="t" class="${filters.kind==='t'?'on':''}">Series</button></div>
        <button class="tog${filters.unwatched?' on':''}" data-tog="unwatched" aria-pressed="${filters.unwatched}"><i></i>Unwatched only</button>
        <button class="tog${filters.fresh?' on':''}" data-tog="fresh" aria-pressed="${filters.fresh}"><i></i>Skip the rotten</button>
      </div></div>
    ${vis.length?`<div class="wall">${cards}</div>`:`<p class="empty">Nothing matches these filters.</p>`}
    <nav class="fr-nav"><button data-open="${prev.id}"><span class="cap">Previous</span><span class="d">${esc(prev.name)}</span></button><button data-open="${next.id}"><span class="cap">Next</span><span class="d">${esc(next.name)}</span></button></nav>
  </div>`;
  $('#topTitle').textContent=f.name;
  renderUpbar(f);
  loadPosters(f,idx);
}
function renderUpbar(f){
  const nx=nextUp(f),w=$('#upbar .wrap');
  if(nx<0){const d=doneCount(f);w.innerHTML=`<div class="txt"><b>${d===f.items.length?'All caught up.':'Nothing released left to watch.'}</b><small>${d} of ${f.items.length} watched</small></div><button class="btn" data-open="${F[(F.indexOf(f)+1)%F.length].id}">Next franchise</button>`;return}
  const it=f.items[nx];
  w.innerHTML=`<button class="thumb" data-sheet="${f.id}:${nx}" aria-label="Details">${posterHTML(f,nx)}</button>
    <div class="txt"><b>${esc(it[0])}</b><small>Up next · #${order(f).indexOf(nx)+1} of ${f.items.length}${it[2]!=null?' · '+it[2]+'%':''}</small></div>
    <button class="btn primary" data-watch="${f.id}:${nx}"><svg aria-hidden="true"><use href="#i-check"/></svg>Watched</button>`;
}

/* ---------- sheet ---------- */
let sheetRef=null;
function openSheet(fid,i){
  const f=byId[fid],it=f.items[i],idx=order(f),pos=idx.indexOf(i)+1,done=isDone(f,i);sheetRef={fid,i};
  const q=encodeURIComponent(it[0]);
  $('#sheetBody').innerHTML=`<div class="grab"></div><button class="close" id="shClose" aria-label="Close"><svg aria-hidden="true"><use href="#i-x"/></svg></button>
    <div class="sh"><div class="post">${posterHTML(f,i)}</div><div>
      <span class="cap">${esc(f.name)}</span><h3 class="d" id="shTitle">${esc(it[0])}</h3>
      <div class="facts">
        <span class="cap">Watch</span><span>#${pos} of ${f.items.length} in ${orderMode} order${pos>1?` · after ${esc(f.items[idx[pos-2]][0])}`:' · this is where you start'}</span>
        <span class="cap">Released</span><span>${fmtDate(it[1])}${released(it)?'':' · not out yet'} · ${it[3]==='t'?'Series':'Film'}</span>
        <span class="cap">Critics</span><span>${rtBadge(it)}${it[2]!=null?` <span style="color:var(--muted)">Tomatometer · ${it[2]>=60?'Fresh':'Rotten'}</span>`:''}</span>
      </div>
      <div class="actions">
        <button class="btn ${done?'':'primary'}" data-watch="${f.id}:${i}"><svg aria-hidden="true"><use href="#i-check"/></svg>${done?'Unmark watched':'Watched it'}</button>
        ${pos>1?`<button class="btn mustard" data-through="${f.id}:${i}">Caught up through here</button>`:''}
      </div>
      <div class="links"><a href="https://www.rottentomatoes.com/search?search=${q}" target="_blank" rel="noopener">Rotten Tomatoes</a><a href="https://www.justwatch.com/us/search?q=${q}" target="_blank" rel="noopener">Where to stream</a><a href="https://en.wikipedia.org/wiki/${encodeURIComponent((it[4]||it[0]).replace(/ /g,'_'))}" target="_blank" rel="noopener">Wikipedia</a></div>
    </div></div>`;
  document.body.classList.add('sheet-open');buzz(6);
  loadPosters(f,[i]);
}
function closeSheet(){document.body.classList.remove('sheet-open');sheetRef=null}

/* ---------- actions ---------- */
let toastT;
function toast(msg,undo){const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button id="undo">Undo</button>':''}`;t.classList.add('show');clearTimeout(toastT);
  if(undo)$('#undo').onclick=()=>{undo();t.classList.remove('show');buzz(10)};toastT=setTimeout(()=>t.classList.remove('show'),4000)}
function snapshot(){return JSON.parse(JSON.stringify(watched))}
function setWatched(f,i,on){watched[f.id]=watched[f.id]||{};if(on)watched[f.id][i]=1;else delete watched[f.id][i];if(!Object.keys(watched[f.id]).length)delete watched[f.id];store.set('catchup.watched',watched)}
function toggle(fid,i){const f=byId[fid],before=snapshot(),on=!isDone(f,i);setWatched(f,i,on);buzz(on?[12,30,18]:12);
  const el=document.querySelector(`.item[data-item="${i}"] .poster`);if(el&&view.fid===fid){el.classList.remove('squeeze');void el.offsetWidth;el.classList.add('squeeze')}
  toast(on?'Marked watched':'Unmarked',()=>{watched=before;store.set('catchup.watched',watched);refresh()});
  refresh()}
function through(fid,i){const f=byId[fid],before=snapshot(),idx=order(f),pos=idx.indexOf(i);let n=0;
  for(let k=0;k<=pos;k++){if(!isDone(f,idx[k])){setWatched(f,idx[k],true);n++}}
  buzz([10,40,10,40,20]);closeSheet();toast(`Marked ${n} ${n===1?'title':'titles'} watched through ${f.items[i][0]}`,()=>{watched=before;store.set('catchup.watched',watched);refresh()});refresh()}
function refresh(){stats();if(view.name==='library')renderLibrary();else renderFranchise(view.fid);if(sheetRef)openSheet(sheetRef.fid,sheetRef.i)}
function stats(){$('#statN').textContent=F.reduce((n,f)=>n+doneCount(f),0)}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-open],[data-sheet],[data-watch],[data-through],[data-order],[data-kind],[data-tog],[data-sort]');if(!t)return;
  if(t.dataset.open){go(t.dataset.open);return}
  if(t.dataset.sheet){const[a,b]=t.dataset.sheet.split(':');openSheet(a,+b);return}
  if(t.dataset.watch){const[a,b]=t.dataset.watch.split(':');toggle(a,+b);return}
  if(t.dataset.through){const[a,b]=t.dataset.through.split(':');through(a,+b);return}
  if(t.dataset.order){orderMode=t.dataset.order;store.set('catchup.order',orderMode);buzz(8);refresh();return}
  if(t.dataset.kind){filters.kind=t.dataset.kind;store.set('catchup.filters',filters);buzz(8);refresh();return}
  if(t.dataset.tog){filters[t.dataset.tog]=!filters[t.dataset.tog];store.set('catchup.filters',filters);buzz(8);refresh();return}
  if(t.dataset.sort){librarySort=t.dataset.sort;store.set('catchup.sort',librarySort);buzz(8);refresh();return}
});
document.addEventListener('click',e=>{
  if(e.target.closest('#shClose')||e.target===$('#scrim'))closeSheet();
  if(e.target.closest('#back'))go('library');
  if(e.target.closest('#copyProg'))copyProgress();
  if(e.target.closest('#resetProg'))resetProgress();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeSheet();$('#results').classList.remove('open');return}
  if(e.target.matches('input'))return;
  if(view.name==='franchise'){const fi=F.indexOf(byId[view.fid]);if(e.key==='ArrowRight')go(F[(fi+1)%F.length].id);if(e.key==='ArrowLeft')go(F[(fi-1+F.length)%F.length].id)}
});
function copyProgress(){const lines=F.filter(f=>doneCount(f)>0).map(f=>{const nx=nextUp(f);return `${f.name}: ${doneCount(f)}/${f.items.length}${nx>=0?' · next: '+f.items[nx][0]:' · caught up'}`});
  const text=lines.length?`Catchup — ${F.reduce((n,f)=>n+doneCount(f),0)} of ${TOTAL} titles\n`+lines.join('\n'):'Catchup — nothing marked yet';
  const done=()=>toast('Progress copied');
  try{navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done))}catch(e){fallbackCopy(text,done)}}
function fallbackCopy(text,done){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){toast('Select and copy from the box');return}ta.remove()}
let resetArmed=false;
function resetProgress(){if(!resetArmed){resetArmed=true;$('#resetProg').textContent='Tap again to erase all progress';setTimeout(()=>{resetArmed=false;const b=$('#resetProg');if(b)b.textContent='Reset'},3000);return}
  const before=snapshot();watched={};store.set('catchup.watched',watched);resetArmed=false;buzz([20,40,20]);toast('Progress erased',()=>{watched=before;store.set('catchup.watched',watched);refresh()});refresh()}

/* ---------- search ---------- */
const q=$('#q'),results=$('#results'),sw=$('#searchWrap');let sel=-1;
function search(){const s=q.value.trim().toLowerCase();sw.classList.toggle('has',!!s);sel=-1;
  if(!s){results.classList.remove('open');q.setAttribute('aria-expanded','false');return}
  const fr=F.filter(f=>f.name.toLowerCase().includes(s)).slice(0,6);
  const ti=[];F.forEach(f=>f.items.forEach((it,i)=>{if(it[0].toLowerCase().includes(s))ti.push({f,i})}));
  let h='';
  if(fr.length)h+=`<div class="grp cap">Franchises</div>`+fr.map(f=>`<button data-open="${f.id}" role="option">${esc(f.name)}<span class="sub">${doneCount(f)}/${f.items.length}</span></button>`).join('');
  if(ti.length)h+=`<div class="grp cap">Titles</div>`+ti.slice(0,10).map(({f,i})=>`<button data-sheet="${f.id}:${i}" role="option">${esc(f.items[i][0])}<span class="sub">${esc(f.name)} · #${order(f).indexOf(i)+1}</span></button>`).join('');
  if(!h)h=`<div class="none">Nothing called “${esc(q.value.trim())}” here yet.</div>`;
  results.innerHTML=h;results.classList.add('open');q.setAttribute('aria-expanded','true')}
q.addEventListener('input',search);q.addEventListener('focus',search);
q.addEventListener('keydown',e=>{const opts=[...results.querySelectorAll('button')];if(!opts.length)return;
  if(e.key==='ArrowDown'){e.preventDefault();sel=(sel+1)%opts.length}else if(e.key==='ArrowUp'){e.preventDefault();sel=(sel-1+opts.length)%opts.length}else if(e.key==='Enter'){e.preventDefault();(opts[sel]||opts[0]).click();return}else return;
  opts.forEach((o,i)=>o.classList.toggle('sel',i===sel));opts[sel].scrollIntoView({block:'nearest'})});
$('#qClear').addEventListener('click',()=>{q.value='';search();q.focus()});
document.addEventListener('click',e=>{if(!sw.contains(e.target))results.classList.remove('open')});
results.addEventListener('click',()=>{results.classList.remove('open');q.value='';sw.classList.remove('has')});

/* ---------- swipe between franchises (touch) ---------- */
let sx=0,sy=0,sw0=false;
const mainEl=$('#view');
mainEl.addEventListener('touchstart',e=>{if(view.name!=='franchise'||document.body.classList.contains('sheet-open'))return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;sw0=true},{passive:true});
mainEl.addEventListener('touchend',e=>{if(!sw0)return;sw0=false;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6){const fi=F.indexOf(byId[view.fid]);go(F[(fi+(dx<0?1:-1)+F.length)%F.length].id)}},{passive:true});

/* ---------- routing ---------- */
function go(id,replace=false){
  closeSheet();results.classList.remove('open');
  if(id==='library'||!byId[id]){view={name:'library',fid:null};document.body.dataset.view='library';renderLibrary()}
  else{view={name:'franchise',fid:id};document.body.dataset.view='franchise';renderFranchise(id)}
  try{if(replace)history.replaceState(null,'','#'+(view.fid||'library'));else if(location.hash!=='#'+(view.fid||'library'))history.pushState(null,'','#'+(view.fid||'library'))}catch(e){}
  window.scrollTo(0,0);
}
window.addEventListener('popstate',()=>{const id=(location.hash||'').slice(1);closeSheet();
  if(id&&byId[id]){view={name:'franchise',fid:id};document.body.dataset.view='franchise';renderFranchise(id)}else{view={name:'library',fid:null};document.body.dataset.view='library';renderLibrary()}
  window.scrollTo(0,0)});

/* ---------- posters ----------
   Wikipedia's page-summary API (CORS-open) gives each title's infobox poster. URLs are cached per device.
   Where a host blocks outside images (the claude.ai artifact sandbox does), the typographic card stays. */
const posterCache=store.get('catchup.posters',{});
const key=it=>it[4]||it[0];
const inflight=new Set();let queue=[],running=0;
function loadPosters(f,idxs){
  idxs.forEach(i=>{const it=f.items[i],k=key(it);if(posterCache[k]!==undefined||inflight.has(k))return;inflight.add(k);queue.push({f,i,k})});
  pump();
}
function pump(){
  while(running<6&&queue.length){const job=queue.shift();running++;
    const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),9000);
    fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(job.k.replace(/ /g,'_')),{signal:ctl.signal,headers:{Accept:'application/json'}})
      .then(r=>r.ok?r.json():null)
      .then(j=>{const u=j&&j.thumbnail&&j.thumbnail.source?j.thumbnail.source.replace(/\/(\d+)px-/,'/500px-'):null;posterCache[job.k]=u;store.set('catchup.posters',posterCache);if(u)paint(job.f,job.i,u)})
      .catch(()=>{})
      .finally(()=>{clearTimeout(to);inflight.delete(job.k);running--;pump()});
  }
}
function paint(f,i,u){
  const img=new Image();img.alt='';img.onload=()=>{
    document.querySelectorAll(`[data-sheet="${f.id}:${i}"], .sh .post`).forEach(el=>{
      if(el.classList.contains('post')&&!(sheetRef&&sheetRef.fid===f.id&&sheetRef.i===i)&&!el.dataset.sheet)return;
      const fb=el.querySelector('.fallback');if(fb){const c=img.cloneNode();fb.replaceWith(c)}});
  };img.src=u;
}

/* ---------- boot ---------- */
stats();
const startId=(location.hash||'').slice(1);
go(byId[startId]?startId:'library',true);
</script>
</body></html>
